name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish EmojiWifiWindows.csproj --configuration Release --runtime win-x64 --self-contained false -o publish

      - name: Package clean zip
        run: Compress-Archive -Path publish/* -DestinationPath "EmojiWifiWindows_${{ github.ref_name }}_Clean.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: EmojiWifiWindows_${{ github.ref_name }}_Clean.zip
          generate_release_notes: true
